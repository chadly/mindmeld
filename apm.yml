name: mindmeld
version: 1.0.0
description: APM project for mindmeld
author: Chad Lee
# Which agent platforms to deploy to.
# Resolution order: --target flag > this field > auto-detect from filesystem.
# Accepted values: agent-skills, antigravity, claude, codex, copilot, cursor, gemini, kiro, opencode, windsurf
targets:
  - claude
dependencies:
  apm: []
  mcp: []
includes: auto
scripts: {}
devDependencies:
  apm:
    - microsoft/apm/packages/apm-guide#v0.26.0
    - chadly/skillz#v1.0.0
    - dietrichgebert/ponytail#v4.8.4
    - herdrdev/herdr/skills/herdr#v0.9.5
  mcp:
    - name: firecrawl
      registry: false
      transport: http
      url: https://mcp.firecrawl.dev/v2/mcp
      headers:
        Authorization: Bearer ${FIRECRAWL_API_KEY}
