services:
  mindmeld:
    image: ghcr.io/chadly/mindmeld
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      # 7317 is taken on this host by the local herdr web ui; override with MINDMELD_PORT
      - "127.0.0.1:${MINDMELD_PORT:-17317}:7317"
    environment:
      # anyone reaching the port can drive the agents' terminals without this
      HERDR_WEB_TOKEN: ${HERDR_WEB_TOKEN:?set HERDR_WEB_TOKEN in .env}
    volumes:
      - home:/home/node # agent logins, herdr state, plugin, projects

volumes:
  home:
